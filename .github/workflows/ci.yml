name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Theme Check
        run: npx --yes @shopify/cli@5.0.0 theme check --fail-level error
