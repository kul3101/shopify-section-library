name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Theme Check
        run: npx --yes @shopify/cli@5.0.0 theme check --fail-level error
